name: poultrypro
description: "PoultryPro - Poultry Farm Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Charts
  fl_chart: ^0.68.0

  # Sharing & File Access
  share_plus: ^7.2.1
  path_provider: ^2.1.2

  # PDF Generation & Printing
  pdf: ^3.11.1
  printing: ^5.13.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  cloud_functions: ^5.1.3

  # State Management
  get: ^4.6.6

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Network & APIs
  http: ^1.1.0

  # Multimedia
  image_picker: ^1.0.7

  # Notifications & File Opening
  flutter_local_notifications: ^17.2.3
  open_file: ^3.5.1

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  uuid: ^4.5.1

  # ML Kit (Modular - Recommended)
  google_mlkit_image_labeling: ^0.12.0
  google_mlkit_face_detection: ^0.11.0
  google_mlkit_text_recognition: ^0.13.1
  google_mlkit_object_detection: ^0.13.0 

  # Camera
  camera: ^0.12.0+1

  # Device Permissions & Pickers
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  file_picker: ^8.1.2
  flutter_contacts: ^1.1.9+2

  # ✅ App Lock (Naya Add Kiya) — Biometric (Face/Fingerprint) + PIN hashing
  local_auth: ^2.3.0
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#131D2D"
  adaptive_icon_foreground: "assets/icon/icon.png"